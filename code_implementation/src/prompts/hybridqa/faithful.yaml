  Example 2:
  Table:
    No | Player | Position | Career | Date honored
    7 | Keith Tkachuk | C | 1992-2001 | December 23, 2011
    9 | Bobby Hull | LW | 1972-1980 | February 19, 1989
    10 | Dale Hawerchuk | C | 1981-1990 | April 5, 2007
