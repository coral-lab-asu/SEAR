    {{"Year": 2007, "Division": 4, "League": "USL PDL", "Regular Season": "2nd", "Playoffs": "Northwest", "Open Cup": "Did not qualify"}},
    {{"Year": 2008, "Division": 4, "League": "USL PDL", "Regular Season": "1st", "Playoffs": "Northwest", "Open Cup": "Did not qualify"}},
    {{"Year": 2009, "Division": 4, "League": "USL PDL", "Regular Season": "7th", "Playoffs": "Northwest", "Open Cup": "Did not qualify"}},
    {{"Year": 2010, "Division": 4, "League": "USL PDL", "Regular Season": "3rd", "Playoffs": "Northwest", "Open Cup": "Did not qualify"}},
    {{"Year": 2011, "Division": 4, "League": "USL PDL", "Regular Season": "8th", "Playoffs": "Northwest", "Open Cup": "Did not qualify"}},
    {{"Year": 2012, "Division": 4, "League": "USL PDL", "Regular Season": "1st", "Playoffs": "Northwest", "Open Cup": "Did not qualify"}},
    {{"Year": 2013, "Division": 4, "League": "USL PDL", "Regular Season": "4th", "Playoffs": "Northwest", "Open Cup": "2nd Round"}}
 ]

 # Initialize variables
 consecutive_years = 0
 max_consecutive_years = 0
 
 # Iterate through the table to find consecutive "Did not qualify" in "Open Cup"
 for entry in table:
    if entry["Open Cup"] == "Did not qualify":
        consecutive_years += 1
    else:
        max_consecutive_years = max(max_consecutive_years, consecutive_years)
        consecutive_years = 0

 # Final check in case the sequence ends at the last entry
 max_consecutive_years = max(max_consecutive_years, consecutive_years)

 # Print the result
 print(f"Final Answer: {{max_consecutive_years}} consecutive years.")
 # Done


 

